<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN - ÜBERMENSCH.EXE</title>
    <link rel="stylesheet" href="style.css?v=1.2">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="nav-bar">
        <a href="index.html" class="nav-link">◄ HOME</a>
        <span class="nav-title">ADMIN SANCTUM</span>
    </nav>

    <main class="content-container">
        <div class="page-header">
            <h1>🛡️ ADMIN SANCTUM</h1>
            <p class="subtitle">SCRIBE'S CHAMBER</p>
        </div>

        <div class="admin-tabs">
            <button class="tab-btn active" data-tab="lifts">ADD LIFT</button>
            <button class="tab-btn" data-tab="thoughts">ADD THOUGHT</button>
            <button class="tab-btn" data-tab="manage">MANAGE</button>
        </div>

        <!-- LIFTS FORM -->
        <div class="tab-content active" id="lifts-tab">
            <form id="lifts-form" class="admin-form">
                <div class="form-group">
                    <label>TITLE *</label>
                    <input type="text" id="lift-title" required placeholder="e.g., Deadlift PR - 500lbs">
                </div>

                <div class="form-group">
                    <label>DATE *</label>
                    <input type="date" id="lift-date" required>
                </div>

                <div class="form-group">
                    <label>YOUTUBE VIDEO URL (optional)</label>
                    <input type="url" id="lift-video" placeholder="https://youtube.com/watch?v=...">
                    <small>Leave empty if uploading image instead</small>
                </div>

                <div class="form-group">
                    <label>IMAGE (optional)</label>
                    <input type="file" id="lift-image" accept="image/*">
                    <small>Upload image if no video</small>
                </div>

                <div class="form-group">
                    <label>NOTES *</label>
                    <textarea id="lift-notes" rows="8" required placeholder="Describe your lift, how you felt, PRs, etc..."></textarea>
                </div>

                <button type="submit" class="btn-primary">SAVE LIFT</button>
            </form>
        </div>

        <!-- THOUGHTS FORM -->
        <div class="tab-content" id="thoughts-tab">
            <form id="thoughts-form" class="admin-form">
                <div class="form-group">
                    <label>TITLE *</label>
                    <input type="text" id="thought-title" required placeholder="e.g., On Discipline">
                </div>

                <div class="form-group">
                    <label>DATE *</label>
                    <input type="date" id="thought-date" required>
                </div>

                <div class="form-group">
                    <label>IMAGE (optional)</label>
                    <input type="file" id="thought-image" accept="image/*">
                    <small>One image per thought</small>
                </div>

                <div class="form-group">
                    <label>CONTENT *</label>
                    <textarea id="thought-content" rows="15" required placeholder="Write your thoughts here..."></textarea>
                </div>

                <button type="submit" class="btn-primary">SAVE THOUGHT</button>
            </form>
        </div>

        <!-- MANAGE TAB -->
        <div class="tab-content" id="manage-tab">
            <div class="admin-form">
                <h2>MANAGE LIFTS</h2>
                <div id="lifts-list" class="manage-list">Loading...</div>
                
                <h2 style="margin-top: 40px;">MANAGE THOUGHTS</h2>
                <div id="thoughts-list" class="manage-list">Loading...</div>

                <h2 style="margin-top: 40px;">DANGER ZONE</h2>
                <div class="button-group">
                    <button onclick="clearLifts()" class="btn-danger">DELETE ALL LIFTS</button>
                    <button onclick="clearThoughts()" class="btn-danger">DELETE ALL THOUGHTS</button>
                </div>
            </div>
        </div>

        <div id="message" class="message"></div>
    </main>

    <div class="scanline"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, serverTimestamp, updateDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyA72C91k6EpeUZvZ8r6oGgeD0diYs9dDDE",
            authDomain: "retrosite-7977d.firebaseapp.com",
            projectId: "retrosite-7977d",
            storageBucket: "retrosite-7977d.firebasestorage.app",
            messagingSenderId: "384802123307",
            appId: "1:384802123307:web:179cdf172e70ad0d4b046e",
            measurementId: "G-T6FS3XQFVW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Set today's date as default
        document.getElementById('lift-date').valueAsDate = new Date();
        document.getElementById('thought-date').valueAsDate = new Date();

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById(btn.dataset.tab + '-tab').classList.add('active');

                if (btn.dataset.tab === 'manage') {
                    loadManageLists();
                }
            });
        });

        // LIFTS FORM SUBMISSION
        document.getElementById('lifts-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const imageFile = document.getElementById('lift-image').files[0];
            const editId = document.getElementById('lift-title').dataset.editId;
            let imageUrl = '';

            if (imageFile) {
                imageUrl = await fileToBase64(imageFile);
            } else if (editId) {
                // Keep existing image if editing and no new image selected
                const liftsQuery = query(collection(db, 'lifts'));
                const liftsSnapshot = await getDocs(liftsQuery);
                liftsSnapshot.forEach((doc) => {
                    if (doc.id === editId) {
                        imageUrl = doc.data().imageUrl || '';
                    }
                });
            }

            const entry = {
                title: document.getElementById('lift-title').value,
                date: document.getElementById('lift-date').value,
                videoUrl: document.getElementById('lift-video').value,
                imageUrl: imageUrl,
                notes: document.getElementById('lift-notes').value,
                timestamp: serverTimestamp()
            };

            try {
                if (editId) {
                    // Update existing
                    const docRef = doc(db, 'lifts', editId);
                    await updateDoc(docRef, entry);
                    showMessage('✓ Lift updated successfully!', 'success');
                    delete document.getElementById('lift-title').dataset.editId;
                } else {
                    // Create new
                    await addDoc(collection(db, 'lifts'), entry);
                    showMessage('✓ Lift saved successfully!', 'success');
                }
                
                document.getElementById('lifts-form').reset();
                document.getElementById('lift-date').valueAsDate = new Date();
                
                // Reset button
                const submitBtn = document.querySelector('#lifts-form button[type="submit"]');
                submitBtn.textContent = 'SAVE LIFT';
                submitBtn.style.background = '';
            } catch (error) {
                console.error('Error saving lift:', error);
                showMessage('✗ Error saving lift', 'error');
            }
        });

        // THOUGHTS FORM SUBMISSION
        document.getElementById('thoughts-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const imageFile = document.getElementById('thought-image').files[0];
            const editId = document.getElementById('thought-title').dataset.editId;
            let imageUrl = '';
            
            if (imageFile) {
                console.log('Image file selected:', imageFile.name);
                imageUrl = await fileToBase64(imageFile);
                console.log('Base64 generated, length:', imageUrl.length);
            } else if (editId) {
                // Keep existing image if editing and no new image selected
                const thoughtsQuery = query(collection(db, 'thoughts'));
                const thoughtsSnapshot = await getDocs(thoughtsQuery);
                thoughtsSnapshot.forEach((doc) => {
                    if (doc.id === editId) {
                        imageUrl = doc.data().imageUrl || '';
                    }
                });
            }
            
            const thought = {
                title: document.getElementById('thought-title').value,
                date: document.getElementById('thought-date').value,
                imageUrl: imageUrl,
                content: document.getElementById('thought-content').value,
                timestamp: serverTimestamp()
            };

            console.log('Saving thought:', thought);

            try {
                if (editId) {
                    // Update existing
                    const docRef = doc(db, 'thoughts', editId);
                    await updateDoc(docRef, thought);
                    showMessage('✓ Thought updated successfully!', 'success');
                    delete document.getElementById('thought-title').dataset.editId;
                } else {
                    // Create new
                    await addDoc(collection(db, 'thoughts'), thought);
                    showMessage('✓ Thought saved successfully!', 'success');
                }
                
                document.getElementById('thoughts-form').reset();
                document.getElementById('thought-date').valueAsDate = new Date();
                
                // Reset button
                const submitBtn = document.querySelector('#thoughts-form button[type="submit"]');
                submitBtn.textContent = 'SAVE THOUGHT';
                submitBtn.style.background = '';
            } catch (error) {
                console.error('Error saving thought:', error);
                showMessage('✗ Error saving thought: ' + error.message, 'error');
            }
        });

        // LOAD MANAGE LISTS
        async function loadManageLists() {
            // Load lifts
            try {
                const liftsQuery = query(collection(db, 'lifts'), orderBy('timestamp', 'desc'));
                const liftsSnapshot = await getDocs(liftsQuery);

                const liftsList = document.getElementById('lifts-list');
                if (liftsSnapshot.empty) {
                    liftsList.innerHTML = '<p class="small">No lifts yet</p>';
                } else {
                    liftsList.innerHTML = '';
                    liftsSnapshot.forEach((docSnapshot) => {
                        const entry = docSnapshot.data();
                        const div = document.createElement('div');
                        div.className = 'manage-item';
                        div.innerHTML = `
                            <span>${entry.title} - ${entry.date}</span>
                            <div>
                                <button onclick="window.editLift('${docSnapshot.id}')" class="btn-edit">EDIT</button>
                                <button onclick="window.deleteLift('${docSnapshot.id}')" class="btn-delete">DELETE</button>
                            </div>
                        `;
                        liftsList.appendChild(div);
                    });
                }
            } catch (error) {
                console.error('Error loading lifts:', error);
            }

            // Load thoughts
            try {
                const thoughtsQuery = query(collection(db, 'thoughts'), orderBy('timestamp', 'desc'));
                const thoughtsSnapshot = await getDocs(thoughtsQuery);

                const thoughtsList = document.getElementById('thoughts-list');
                if (thoughtsSnapshot.empty) {
                    thoughtsList.innerHTML = '<p class="small">No thoughts yet</p>';
                } else {
                    thoughtsList.innerHTML = '';
                    thoughtsSnapshot.forEach((docSnapshot) => {
                        const thought = docSnapshot.data();
                        const div = document.createElement('div');
                        div.className = 'manage-item';
                        div.innerHTML = `
                            <span>${thought.title} - ${thought.date}</span>
                            <div>
                                <button onclick="window.editThought('${docSnapshot.id}')" class="btn-edit">EDIT</button>
                                <button onclick="window.deleteThought('${docSnapshot.id}')" class="btn-delete">DELETE</button>
                            </div>
                        `;
                        thoughtsList.appendChild(div);
                    });
                }
            } catch (error) {
                console.error('Error loading thoughts:', error);
            }
        }

        // EDIT FUNCTIONS
        window.editThought = async function(id) {
            console.log('Editing thought:', id);
            try {
                const thoughtsQuery = query(collection(db, 'thoughts'));
                const thoughtsSnapshot = await getDocs(thoughtsQuery);
                
                let thoughtData = null;
                thoughtsSnapshot.forEach((doc) => {
                    if (doc.id === id) {
                        thoughtData = { id: doc.id, ...doc.data() };
                    }
                });
                
                if (!thoughtData) {
                    showMessage('✗ Thought not found', 'error');
                    return;
                }
                
                // Switch to thoughts tab
                document.querySelector('[data-tab="thoughts"]').click();
                
                // Populate form
                document.getElementById('thought-title').value = thoughtData.title;
                document.getElementById('thought-date').value = thoughtData.date;
                document.getElementById('thought-content').value = thoughtData.content;
                
                // Store the ID for update
                document.getElementById('thought-title').dataset.editId = id;
                
                // Change button text
                const submitBtn = document.querySelector('#thoughts-form button[type="submit"]');
                submitBtn.textContent = 'UPDATE THOUGHT';
                submitBtn.style.background = 'var(--warning)';
                
                showMessage('Editing: ' + thoughtData.title, 'success');
            } catch (error) {
                console.error('Error loading thought:', error);
                showMessage('✗ Error loading thought', 'error');
            }
        };

        window.editLift = async function(id) {
            console.log('Editing lift:', id);
            try {
                const liftsQuery = query(collection(db, 'lifts'));
                const liftsSnapshot = await getDocs(liftsQuery);
                
                let liftData = null;
                liftsSnapshot.forEach((doc) => {
                    if (doc.id === id) {
                        liftData = { id: doc.id, ...doc.data() };
                    }
                });
                
                if (!liftData) {
                    showMessage('✗ Lift not found', 'error');
                    return;
                }
                
                // Switch to lifts tab
                document.querySelector('[data-tab="lifts"]').click();
                
                // Populate form
                document.getElementById('lift-title').value = liftData.title;
                document.getElementById('lift-date').value = liftData.date;
                document.getElementById('lift-video').value = liftData.videoUrl || '';
                document.getElementById('lift-notes').value = liftData.notes;
                
                // Store the ID for update
                document.getElementById('lift-title').dataset.editId = id;
                
                // Change button text
                const submitBtn = document.querySelector('#lifts-form button[type="submit"]');
                submitBtn.textContent = 'UPDATE LIFT';
                submitBtn.style.background = 'var(--warning)';
                
                showMessage('Editing: ' + liftData.title, 'success');
            } catch (error) {
                console.error('Error loading lift:', error);
                showMessage('✗ Error loading lift', 'error');
            }
        };

        // DELETE FUNCTIONS - Attach to window for onclick to work
        window.deleteLift = async function(id) {
            console.log('deleteLift called with id:', id);
            console.log('ID type:', typeof id);
            
            if (!confirm('Delete this lift?')) return;
            
            try {
                console.log('Attempting to delete from lifts collection...');
                const docRef = doc(db, 'lifts', id);
                
                await deleteDoc(docRef);
                console.log('Delete successful!');
                
                showMessage('✓ Lift deleted', 'success');
                loadManageLists();
            } catch (error) {
                console.error('FULL ERROR DETAILS:', error);
                console.error('Error message:', error.message);
                showMessage('✗ Error: ' + error.message, 'error');
            }
        };

        window.deleteThought = async function(id) {
            console.log('deleteThought called with id:', id);
            console.log('ID type:', typeof id);
            console.log('ID value:', id);
            
            if (!confirm('Delete this thought?')) return;
            
            try {
                console.log('Attempting to delete from thoughts collection...');
                const docRef = doc(db, 'thoughts', id);
                console.log('Document reference created:', docRef);
                
                await deleteDoc(docRef);
                console.log('Delete successful!');
                
                showMessage('✓ Thought deleted', 'success');
                loadManageLists();
            } catch (error) {
                console.error('FULL ERROR DETAILS:', error);
                console.error('Error name:', error.name);
                console.error('Error message:', error.message);
                console.error('Error code:', error.code);
                showMessage('✗ Error: ' + error.message, 'error');
            }
        };

        window.clearLifts = async function() {
            if (!confirm('Delete ALL lifts? This cannot be undone!')) return;
            try {
                const snapshot = await getDocs(collection(db, 'lifts'));
                const deletePromises = snapshot.docs.map(doc => deleteDoc(doc.ref));
                await Promise.all(deletePromises);
                showMessage('✓ All lifts deleted', 'success');
                loadManageLists();
            } catch (error) {
                console.error('Error:', error);
                showMessage('✗ Error deleting lifts', 'error');
            }
        };

        window.clearThoughts = async function() {
            if (!confirm('Delete ALL thoughts? This cannot be undone!')) return;
            try {
                const snapshot = await getDocs(collection(db, 'thoughts'));
                const deletePromises = snapshot.docs.map(doc => deleteDoc(doc.ref));
                await Promise.all(deletePromises);
                showMessage('✓ All thoughts deleted', 'success');
                loadManageLists();
            } catch (error) {
                console.error('Error:', error);
                showMessage('✗ Error deleting thoughts', 'error');
            }
        };

        // Helper function to convert file to base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Show message function
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 3000);
        }
    </script>
    <script src="script.js"></script>
    
    <style>
        .manage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background: var(--bg-dark);
            border: 2px solid var(--border);
            font-size: 0.6rem;
        }
        .btn-delete {
            font-family: 'Press Start 2P', cursive;
            background: var(--danger);
            color: white;
            border: 2px solid var(--danger);
            padding: 8px 16px;
            font-size: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-delete:hover {
            background: transparent;
            color: var(--danger);
            transform: translateY(-2px);
            box-shadow: 0 4px 0 var(--danger);
        }
        .btn-delete:active {
            transform: translateY(0);
            box-shadow: 0 2px 0 var(--danger);
        }
    </style>
</body>
</html>
