<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN PANEL - 8-BIT</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="nav-bar">
        <a href="index.html" class="nav-link">◄ HOME</a>
        <span class="nav-title">ADMIN PANEL</span>
    </nav>

    <main class="content-container">
        <div class="page-header">
            <h1>⚙️ CONTROL PANEL</h1>
            <p class="subtitle">ADD & MANAGE CONTENT</p>
        </div>

        <div class="admin-tabs">
            <button class="tab-btn active" data-tab="gym">ADD GYM ENTRY</button>
            <button class="tab-btn" data-tab="note">ADD NOTE</button>
            <button class="tab-btn" data-tab="manage">MANAGE DATA</button>
        </div>

        <!-- GYM ENTRY FORM -->
        <div class="tab-content active" id="gym-tab">
            <form id="gym-form" class="admin-form">
                <div class="form-group">
                    <label>WORKOUT TITLE *</label>
                    <input type="text" id="gym-title" required placeholder="e.g., Bench Press PR - 225lbs">
                </div>

                <div class="form-group">
                    <label>DATE *</label>
                    <input type="date" id="gym-date" required>
                </div>

                <div class="form-group">
                    <label>YOUTUBE VIDEO URL (optional)</label>
                    <input type="url" id="gym-video" placeholder="https://youtube.com/watch?v=...">
                    <small>Paste full YouTube URL (works with unlisted videos)</small>
                </div>

                <div class="form-group">
                    <label>IMAGE (optional)</label>
                    <input type="file" id="gym-image" accept="image/*">
                    <small>Upload a photo from your device</small>
                </div>

                <div class="form-group">
                    <label>WORKOUT NOTES *</label>
                    <textarea id="gym-notes" rows="5" required placeholder="How did the workout go? How did you feel? Any PRs?"></textarea>
                </div>

                <button type="submit" class="btn-primary">SAVE WORKOUT</button>
            </form>
        </div>

        <!-- NOTE FORM -->
        <div class="tab-content" id="note-tab">
            <form id="note-form" class="admin-form">
                <div class="form-group">
                    <label>NOTE TYPE *</label>
                    <select id="note-type" required>
                        <option value="thought">💭 Shower Thought</option>
                        <option value="learning">📚 Learning Note</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>TITLE *</label>
                    <input type="text" id="note-title" required placeholder="e.g., Why we procrastinate">
                </div>

                <div class="form-group">
                    <label>DATE *</label>
                    <input type="date" id="note-date" required>
                </div>

                <div class="form-group">
                    <label>CONTENT *</label>
                    <textarea id="note-content" rows="8" required placeholder="Write your thought or learning note here..."></textarea>
                </div>

                <div class="form-group">
                    <label>TAGS (optional)</label>
                    <input type="text" id="note-tags" placeholder="psychology, productivity, habits">
                    <small>Separate tags with commas</small>
                </div>

                <button type="submit" class="btn-primary">SAVE NOTE</button>
            </form>
        </div>

        <!-- DATA MANAGEMENT -->
        <div class="tab-content" id="manage-tab">
            <div class="admin-form">
                <h2>MANAGE ENTRIES</h2>
                <p class="warning-text">⚠️ View and delete entries below</p>
                
                <h3 style="margin-top: 20px;">GYM ENTRIES</h3>
                <div id="gym-list" class="manage-list">Loading...</div>
                
                <h3 style="margin-top: 30px;">NOTES</h3>
                <div id="notes-manage-list" class="manage-list">Loading...</div>
            </div>
        </div>

        <div id="message" class="message"></div>
    </main>

    <div class="scanline"></div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
        apiKey: "AIzaSyA72C91k6EpeUZvZ8r6oGgeD0diYs9dDDE",
        authDomain: "retrosite-7977d.firebaseapp.com",
        projectId: "retrosite-7977d",
        storageBucket: "retrosite-7977d.firebasestorage.app",
        messagingSenderId: "384802123307",
        appId: "1:384802123307:web:179cdf172e70ad0d4b046e",
        measurementId: "G-T6FS3XQFVW"
        };
// Test git commit lol
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Set today's date as default
        document.getElementById('gym-date').valueAsDate = new Date();
        document.getElementById('note-date').valueAsDate = new Date();

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById(btn.dataset.tab + '-tab').classList.add('active');
                
                // Load manage lists when manage tab is opened
                if (btn.dataset.tab === 'manage') {
                    loadManageLists();
                }
            });
        });

        // GYM FORM SUBMISSION
        document.getElementById('gym-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const imageFile = document.getElementById('gym-image').files[0];
            let imageUrl = '';
            
            if (imageFile) {
                imageUrl = await fileToBase64(imageFile);
            }
            
            const entry = {
                title: document.getElementById('gym-title').value,
                date: document.getElementById('gym-date').value,
                videoUrl: document.getElementById('gym-video').value,
                imageUrl: imageUrl,
                notes: document.getElementById('gym-notes').value,
                timestamp: serverTimestamp()
            };
            
            try {
                await addDoc(collection(db, 'gymEntries'), entry);
                showMessage('✓ Workout saved successfully!', 'success');
                document.getElementById('gym-form').reset();
                document.getElementById('gym-date').valueAsDate = new Date();
            } catch (error) {
                console.error('Error saving workout:', error);
                showMessage('✗ Error saving workout', 'error');
            }
        });

        // NOTE FORM SUBMISSION
        document.getElementById('note-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const note = {
                type: document.getElementById('note-type').value,
                title: document.getElementById('note-title').value,
                date: document.getElementById('note-date').value,
                content: document.getElementById('note-content').value,
                tags: document.getElementById('note-tags').value,
                timestamp: serverTimestamp()
            };
            
            try {
                await addDoc(collection(db, 'notes'), note);
                showMessage('✓ Note saved successfully!', 'success');
                document.getElementById('note-form').reset();
                document.getElementById('note-date').valueAsDate = new Date();
            } catch (error) {
                console.error('Error saving note:', error);
                showMessage('✗ Error saving note', 'error');
            }
        });

        // LOAD MANAGE LISTS
        async function loadManageLists() {
            // Load gym entries
            try {
                const gymQuery = query(collection(db, 'gymEntries'), orderBy('timestamp', 'desc'));
                const gymSnapshot = await getDocs(gymQuery);
                
                const gymList = document.getElementById('gym-list');
                if (gymSnapshot.empty) {
                    gymList.innerHTML = '<p class="small">No gym entries yet</p>';
                } else {
                    gymList.innerHTML = '';
                    gymSnapshot.forEach((docSnapshot) => {
                        const entry = docSnapshot.data();
                        const div = document.createElement('div');
                        div.className = 'manage-item';
                        div.innerHTML = `
                            <span>${entry.title} - ${entry.date}</span>
                            <button onclick="deleteGymEntry('${docSnapshot.id}')" class="btn-delete">DELETE</button>
                        `;
                        gymList.appendChild(div);
                    });
                }
            } catch (error) {
                console.error('Error loading gym entries:', error);
            }

            // Load notes
            try {
                const notesQuery = query(collection(db, 'notes'), orderBy('timestamp', 'desc'));
                const notesSnapshot = await getDocs(notesQuery);
                
                const notesList = document.getElementById('notes-manage-list');
                if (notesSnapshot.empty) {
                    notesList.innerHTML = '<p class="small">No notes yet</p>';
                } else {
                    notesList.innerHTML = '';
                    notesSnapshot.forEach((docSnapshot) => {
                        const note = docSnapshot.data();
                        const div = document.createElement('div');
                        div.className = 'manage-item';
                        div.innerHTML = `
                            <span>${note.title} - ${note.date}</span>
                            <button onclick="deleteNote('${docSnapshot.id}')" class="btn-delete">DELETE</button>
                        `;
                        notesList.appendChild(div);
                    });
                }
            } catch (error) {
                console.error('Error loading notes:', error);
            }
        }

        // DELETE FUNCTIONS
        window.deleteGymEntry = async function(id) {
            if (!confirm('Delete this gym entry?')) return;
            
            try {
                await deleteDoc(doc(db, 'gymEntries', id));
                showMessage('✓ Entry deleted', 'success');
                loadManageLists();
            } catch (error) {
                console.error('Error deleting:', error);
                showMessage('✗ Error deleting entry', 'error');
            }
        };

        window.deleteNote = async function(id) {
            if (!confirm('Delete this note?')) return;
            
            try {
                await deleteDoc(doc(db, 'notes', id));
                showMessage('✓ Note deleted', 'success');
                loadManageLists();
            } catch (error) {
                console.error('Error deleting:', error);
                showMessage('✗ Error deleting note', 'error');
            }
        };

        // HELPER FUNCTIONS
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message ${type}`;
            msg.style.display = 'block';
            setTimeout(() => msg.style.display = 'none', 3000);
        }
    </script>
    <script src="script.js"></script>
    
    <style>
        .manage-list {
            margin-top: 10px;
        }
        .manage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background: var(--bg-dark);
            border: 2px solid var(--border);
            font-size: 0.6rem;
        }
        .btn-delete {
            font-family: 'Press Start 2P', cursive;
            background: var(--danger);
            color: white;
            border: 2px solid var(--danger);
            padding: 8px 16px;
            font-size: 0.5rem;
            cursor: pointer;
        }
        .btn-delete:hover {
            background: transparent;
            color: var(--danger);
        }
    </style>
</body>
</html>
