<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THOUGHTS - ÜBERMENSCH.EXE</title>
    <link rel="stylesheet" href="style.css?v=1.2">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="nav-bar">
        <a href="index.html" class="nav-link">◄ HOME</a>
        <span class="nav-title">THOUGHTS</span>
        <a href="admin.html" class="nav-link">ADMIN ►</a>
    </nav>

    <main class="content-container">
       <div class="page-header">
    <h1>
        <img src="images/book.png" width="70" height="70" style="display: inline-block; vertical-align: middle; margin-right: 15px; image-rendering: pixelated;" alt="book">
        THOUGHTS & IDEAS
        <img src="images/cup.png" width="80" height="80" style="display: inline-block; vertical-align: middle; margin-left: 15px; image-rendering: pixelated;" alt="coffee cup">
    </h1>
    <p class="subtitle">I THINK THEREFORE I AM</p>
</div>

        <div id="thoughts-container" class="newspaper-container">
            <div class="empty-state">
                <p>NO THOUGHTS FOUND</p>
                <p class="small">GO TO ADMIN TO ADD YOUR FIRST THOUGHT</p>
            </div>
        </div>
    </main>

    <div class="scanline"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyA72C91k6EpeUZvZ8r6oGgeD0diYs9dDDE",
            authDomain: "retrosite-7977d.firebaseapp.com",
            projectId: "retrosite-7977d",
            storageBucket: "retrosite-7977d.firebasestorage.app",
            messagingSenderId: "384802123307",
            appId: "1:384802123307:web:179cdf172e70ad0d4b046e",
            measurementId: "G-T6FS3XQFVW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        loadThoughts();

        async function loadThoughts() {
            const container = document.getElementById('thoughts-container');
            
            try {
                const q = query(collection(db, 'thoughts'), orderBy('timestamp', 'desc'));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <p>NO THOUGHTS FOUND</p>
                            <p class="small">GO TO ADMIN TO ADD YOUR FIRST THOUGHT</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                let index = 0;
                querySnapshot.forEach((doc) => {
                    const thought = doc.data();
                    console.log('Loading thought:', thought.title);
                    console.log('Has imageUrl:', !!thought.imageUrl);
                    console.log('Has media array:', Array.isArray(thought.media));
                    html += renderThought(thought, index);
                    index++;
                });
                
                container.innerHTML = html;
                
            } catch (error) {
                console.error('Error loading thoughts:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <p>ERROR LOADING THOUGHTS</p>
                        <p class="small">Check console for details</p>
                    </div>
                `;
            }
        }

        function renderThought(thought, index) {
            // Determine if image should be on left or right (alternate)
            const imageOnLeft = index % 2 === 0;
            
            // Get images from BOTH old format (imageUrl) and new format (media array)
            let images = [];
            
            // NEW FORMAT: Check media array first
            if (Array.isArray(thought.media) && thought.media.length > 0) {
                console.log('Using media array for:', thought.title);
                images = thought.media
                    .filter(m => m.type === 'image')
                    .map(m => m.url);
                console.log('Found images in media array:', images.length);
            }
            // OLD FORMAT: Fallback to imageUrl
            else if (thought.imageUrl && thought.imageUrl.trim()) {
                console.log('Using imageUrl for:', thought.title);
                images = [thought.imageUrl];
            }
            
            const content = thought.content || '';
            const imageCount = images.length;
            
            console.log('Final image count:', imageCount);
            
            // Add drop cap to first word
            const formattedContent = addDropCap(content);
            
            // No images - full width text
            if (imageCount === 0) {
                return `
                    <article class="newspaper-article">
                        <div class="article-header">
                            <h2 class="article-title">${thought.title}</h2>
                            <span class="article-date">${thought.date}</span>
                        </div>
                        <div class="article-content single-column">
                            <div class="article-text full-width">
                                ${formattedContent}
                            </div>
                        </div>
                    </article>
                `;
            }
            
            // Only images, no text - display images side by side
            if (imageCount > 0 && !content.trim()) {
                return `
                    <article class="newspaper-article">
                        <div class="article-header">
                            <h2 class="article-title">${thought.title}</h2>
                            <span class="article-date">${thought.date}</span>
                        </div>
                        <div class="article-content">
                            <div class="image-gallery">
                                ${images.map(url => `
                                    <div class="gallery-image">
                                        <img src="${url}" alt="${thought.title}" loading="lazy">
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </article>
                `;
            }
            
            // 1 image with text - image floats (CSS handles left/right alternating)
            if (imageCount === 1) {
                return `
                    <article class="newspaper-article">
                        <div class="article-header">
                            <h2 class="article-title">${thought.title}</h2>
                            <span class="article-date">${thought.date}</span>
                        </div>
                        <div class="article-content single-column">
                            <div class="float-image">
                                <img src="${images[0]}" alt="${thought.title}" loading="lazy">
                            </div>
                            <div class="article-text">
                                ${formattedContent}
                            </div>
                            <div style="clear: both;"></div>
                        </div>
                    </article>
                `;
            }
            
            // 2+ images with text - two column layout
            return `
                <article class="newspaper-article">
                    <div class="article-header">
                        <h2 class="article-title">${thought.title}</h2>
                        <span class="article-date">${thought.date}</span>
                    </div>
                    <div class="article-content two-column">
                        <div class="article-media">
                            ${images.map(url => `
                                <div class="stacked-image">
                                    <img src="${url}" alt="${thought.title}" loading="lazy">
                                </div>
                            `).join('')}
                        </div>
                        <div class="article-text">
                            ${formattedContent}
                        </div>
                    </div>
                </article>
            `;
        }

        function addDropCap(text) {
            if (!text || !text.trim()) return '';
            
            // Replace line breaks with proper HTML
            text = text.replace(/\n/g, '<br>');
            
            // Find first letter
            const match = text.match(/^(\w)/);
            if (!match) return `<p>${text}</p>`;
            
            const firstLetter = match[1];
            const restOfText = text.substring(1);
            
            return `<p><span class="drop-cap">${firstLetter.toUpperCase()}</span>${restOfText}</p>`;
        }
    </script>
    <script src="script.js"></script>
    <script>
        window.INK_ENABLED   = true;  // ← set false to disable ink on this page
        window.AUDIO_ENABLED = true;  // ← set false to disable fire audio on this page
    </script>
    <script src="ink.js"></script>
</body>
</html>
