<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-BIT PERSONAL SITE</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Font for pixel/retro look -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Main container for the start screen -->
    <div class="start-screen">
        <!-- Retro game title -->
        <div class="game-title">
            <h1 class="glitch" data-text="PERSONAL.EXE">PERSONAL.EXE</h1>
            <p class="subtitle">PLAYER ONE START</p>
        </div>

        <!-- Menu options styled like old game menus -->
        <div class="menu">
            <div class="menu-item" data-page="gym.html">
                <span class="menu-arrow">►</span>
                <span class="menu-text">GYM LOG</span>
            </div>
            <div class="menu-item" data-page="notes.html">
                <span class="menu-arrow">►</span>
                <span class="menu-text">THOUGHTS & NOTES</span>
            </div>
            <div class="menu-item" data-page="admin.html">
                <span class="menu-arrow">►</span>
                <span class="menu-text">ADMIN PANEL</span>
            </div>
        </div>

        <!-- Retro footer info -->
        <div class="footer-info">
            <p>PRESS ENTER OR CLICK TO SELECT</p>
            <p class="credits">© 2026 - RETRO EDITION</p>
        </div>

        <!-- Animated scanline effect for CRT monitor feel -->
        <div class="scanline"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
