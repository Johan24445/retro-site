<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÜBERMENSCH.EXE</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* menu-row: [fire] [menu] [character]
           Fire is a flex sibling — scales with zoom just like the character */
        .menu-row {
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            justify-content: center;
            margin-bottom: var(--spacing-xl);
            width: 100%;
        }

        .menu-row .menu {
            margin-bottom: 0;
            flex-shrink: 0;
            position: relative;
            z-index: 100;
        }

        .menu-row .menu .menu-item {
            cursor: pointer;
        }

        /* ═══════════════════════════════════════════════
           FIRE GIF — in normal flex flow (same as character)
           so it scales correctly with browser zoom.

           TO ADJUST FIRE:
             width:          size of the fire wrapper
             margin-right:   gap between fire and menu
             margin-bottom:  negative = overlap below, positive = lift up
             img width:      actual gif size relative to wrapper
        ═══════════════════════════════════════════════ */
        .fire-wrapper {
            position: relative;        /* in flex flow — zoom-proof */
            width: 300px;              /* ← wrapper size */
            margin-right: -50px;        /* ← gap between fire and menu */
            margin-bottom: -70px;      /* ← vertical offset */
            flex-shrink: 0;
            align-self: flex-end;
            pointer-events: none;
        }

        .fire-wrapper img {
            width: 100%;
            display: block;
        }

        .character-wrapper {
            position: relative;
            width: 250px;
            margin-left: 10px;
            margin-bottom: -30px;
            flex-shrink: 0;
            align-self: flex-end;
            pointer-events: none;
        }

        .character-wrapper .character-base {
            width: 100%;
            display: block;
            image-rendering: pixelated;
        }

        .eye-container {
            position: absolute;
            top: 29%;
            left: 31%;
            width: 26%;
            height: 8%;
            pointer-events: none;
        }

        .eye {
            position: absolute;
            width: 33%;
            aspect-ratio: 1;
            background: white;
            border-radius: 50%;
            border: 1.5px solid rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .eye.left  { top: 20%; left: 0%; }
        .eye.right { top: 0%;  right: 0%; }

        .pupil-dot {
            position: absolute;
            width: 44%;
            aspect-ratio: 1;
            background: #1a1008;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* ink styles injected by ink.js */
    </style>
</head>
<body>
    <div class="start-screen">

        <div class="game-title">
            <h1 class="glitch" data-text="ÜBERMENSCH.EXE">ÜBERMENSCH.EXE</h1>
            <p class="subtitle">THE KNIGHT'S CODEX</p>
        </div>

        <div class="menu-row">

            <!-- Fire gif — left flex item, zoom-proof like the character -->
            <div class="fire-wrapper">
                <img src="images/fire4.gif" alt="fire">
            </div>

            <!-- Menu — dead centre -->
            <div class="menu">
                <div class="menu-item" data-page="login.html" onclick="window.location.href='login.html'">
                    <span class="menu-arrow">►</span>
                    <span class="menu-text">ADMIN</span>
                </div>
                <div class="menu-item" data-page="lifts.html" onclick="window.location.href='lifts.html'">
                    <span class="menu-arrow">►</span>
                    <span class="menu-text">LIFTS</span>
                </div>
                <div class="menu-item" data-page="thoughts.html" onclick="window.location.href='thoughts.html'">
                    <span class="menu-arrow">►</span>
                    <span class="menu-text">THOUGHTS</span>
                </div>
            </div>

            <!-- Character — right of menu, in flex flow -->
            <div class="character-wrapper" id="characterWrapper">
                <div class="eye-container" id="eyeContainer">
                    <div class="eye left"  id="eyeLeft"><div  class="pupil-dot" id="pupilLeft"></div></div>
                    <div class="eye right" id="eyeRight"><div class="pupil-dot" id="pupilRight"></div></div>
                </div>
                <img src="images/character.png" alt="character" class="character-base" id="characterBase">
            </div>
        </div>

        <div class="footer-info">
            <p>PRESS ENTER OR CLICK TO SELECT</p>
            <p class="credits">© 2026 - RETRO EDITION</p>
        </div>

        <div class="scanline"></div>
    </div>

    <script src="script.js"></script>
    <script>
    (function () {
        const eyeLeft    = document.getElementById('eyeLeft');
        const eyeRight   = document.getElementById('eyeRight');
        const pupilLeft  = document.getElementById('pupilLeft');
        const pupilRight = document.getElementById('pupilRight');

        function movePupil(eyeEl, pupilEl, mx, my) {
            const r  = eyeEl.getBoundingClientRect();
            const cx = r.left + r.width  / 2;
            const cy = r.top  + r.height / 2;
            const angle     = Math.atan2(my - cy, mx - cx);
            const maxOffset = r.width * 0.22;
            pupilEl.style.transform = `translate(calc(-50% + ${Math.cos(angle) * maxOffset}px), calc(-50% + ${Math.sin(angle) * maxOffset}px))`;
        }

        document.addEventListener('mousemove', (e) => {
            movePupil(eyeLeft,  pupilLeft,  e.clientX, e.clientY);
            movePupil(eyeRight, pupilRight, e.clientX, e.clientY);
        });

        pupilLeft.style.transform  = 'translate(-50%, -50%)';
        pupilRight.style.transform = 'translate(-50%, -50%)';
    })();

    </script>

    <script>
        window.INK_ENABLED   = true;  // ← set false to disable ink on this page
        window.AUDIO_ENABLED = true;  // ← set false to disable fire audio on this page
    </script>
    <script src="ink.js"></script>
</body>
</html>
