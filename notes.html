<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOTES - 8-BIT</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="nav-bar">
        <a href="index.html" class="nav-link">◄ HOME</a>
        <span class="nav-title">THOUGHTS & NOTES</span>
        <a href="admin.html" class="nav-link">EDIT ►</a>
    </nav>

    <main class="content-container">
        <div class="page-header">
            <h1>📝 KNOWLEDGE BASE</h1>
            <p class="subtitle">SHOWER THOUGHTS & LEARNING LOGS</p>
        </div>

        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">ALL</button>
            <button class="filter-btn" data-filter="thought">THOUGHTS</button>
            <button class="filter-btn" data-filter="learning">LEARNING</button>
        </div>

        <div id="notes-list" class="notes-list">
            <div class="empty-state">
                <p>LOADING NOTES...</p>
            </div>
        </div>
    </main>

    <div class="scanline"></div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
        apiKey: "AIzaSyA72C91k6EpeUZvZ8r6oGgeD0diYs9dDDE",
        authDomain: "retrosite-7977d.firebaseapp.com",
        projectId: "retrosite-7977d",
        storageBucket: "retrosite-7977d.firebasestorage.app",
        messagingSenderId: "384802123307",
        appId: "1:384802123307:web:179cdf172e70ad0d4b046e",
        measurementId: "G-T6FS3XQFVW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allNotes = [];
        let currentFilter = 'all';

        // Load notes when page loads
        loadNotes();

        // Setup filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                displayNotes();
            });
        });

        async function loadNotes() {
            try {
                const q = query(collection(db, 'notes'), orderBy('timestamp', 'desc'));
                const querySnapshot = await getDocs(q);
                
                allNotes = [];
                querySnapshot.forEach((doc) => {
                    allNotes.push(doc.data());
                });
                
                displayNotes();
            } catch (error) {
                console.error('Error loading notes:', error);
                document.getElementById('notes-list').innerHTML = `
                    <div class="empty-state">
                        <p>ERROR LOADING NOTES</p>
                        <p class="small">Check console for details</p>
                    </div>
                `;
            }
        }

        function displayNotes() {
            const container = document.getElementById('notes-list');
            
            const filteredNotes = currentFilter === 'all' 
                ? allNotes 
                : allNotes.filter(note => note.type === currentFilter);

            if (filteredNotes.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>NO NOTES FOUND</p>
                        <p class="small">GO TO ADMIN PANEL TO ADD YOUR FIRST NOTE</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredNotes.map(note => `
                <div class="note-card ${note.type}">
                    <div class="note-header">
                        <span class="note-badge">${note.type === 'thought' ? '💭 THOUGHT' : '📚 LEARNING'}</span>
                        <span class="note-date">${note.date}</span>
                    </div>
                    <h3 class="note-title">${note.title}</h3>
                    <div class="note-content">
                        <p>${note.content}</p>
                    </div>
                    ${note.tags ? `
                        <div class="note-tags">
                            ${note.tags.split(',').map(tag => 
                                `<span class="tag">#${tag.trim()}</span>`
                            ).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
