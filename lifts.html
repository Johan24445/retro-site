<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIFTS - ÜBERMENSCH.EXE</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation bar at top -->
    <nav class="nav-bar">
        <a href="index.html" class="nav-link">◄ HOME</a>
        <span class="nav-title">LIFTS</span>
        <a href="admin.html" class="nav-link">ADMIN ►</a>
    </nav>

    <!-- Main content area -->
    <main class="content-container">
        <div class="page-header">
            <h1>💖 LIFTING JOURNAL</h1>
            <p class="subtitle">STRENGTH & PROGRESS</p>
        </div>

        <!-- This is where lift entries will be dynamically loaded -->
        <div id="lifts-container" class="newspaper-container">
            <!-- Entries will be inserted here by JavaScript -->
            <div class="empty-state">
                <p>NO ENTRIES FOUND</p>
                <p class="small">GO TO ADMIN TO ADD YOUR FIRST LIFT</p>
            </div>
        </div>
    </main>

    <!-- Scanline effect -->
    <div class="scanline"></div>

    <script type="module">
        // Import Firebase
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // ⚠️ REPLACE THIS WITH YOUR FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Load lift entries when page loads
        loadLifts();

        async function loadLifts() {
            const container = document.getElementById('lifts-container');
            
            try {
                // Get all lift entries from Firestore, ordered by date
                const q = query(collection(db, 'lifts'), orderBy('timestamp', 'desc'));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <p>NO ENTRIES FOUND</p>
                            <p class="small">GO TO ADMIN TO ADD YOUR FIRST LIFT</p>
                        </div>
                    `;
                    return;
                }

                // Build HTML for all entries in newspaper layout
                let html = '';
                querySnapshot.forEach((doc) => {
                    const entry = doc.data();
                    html += `
                        <article class="newspaper-article">
                            <div class="article-header">
                                <h2 class="article-title">${entry.title}</h2>
                                <span class="article-date">${entry.date}</span>
                            </div>
                            
                            <div class="article-content">
                                <div class="article-media">
                                    ${entry.videoUrl ? `
                                        <div class="video-wrapper">
                                            <iframe 
                                                src="${getYouTubeEmbedUrl(entry.videoUrl)}" 
                                                frameborder="0" 
                                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                                allowfullscreen>
                                            </iframe>
                                        </div>
                                    ` : entry.imageUrl ? `
                                        <div class="image-wrapper">
                                            <img src="${entry.imageUrl}" alt="${entry.title}" loading="lazy">
                                        </div>
                                    ` : ''}
                                </div>
                                
                                <div class="article-text">
                                    <p>${entry.notes.replace(/\n/g, '<br>')}</p>
                                </div>
                            </div>
                        </article>
                    `;
                });
                
                container.innerHTML = html;
                
            } catch (error) {
                console.error('Error loading lifts:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <p>ERROR LOADING ENTRIES</p>
                        <p class="small">Check console for details</p>
                    </div>
                `;
            }
        }

        function getYouTubeEmbedUrl(url) {
            const videoId = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
            return videoId ? `https://www.youtube.com/embed/${videoId[1]}` : url;
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
