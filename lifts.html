<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYM LOG - 8-BIT</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="nav-bar">
        <a href="index.html" class="nav-link">◄ HOME</a>
        <span class="nav-title">GYM LOG</span>
        <a href="admin.html" class="nav-link">EDIT ►</a>
    </nav>

    <main class="content-container">
        <div class="page-header">
            <h1>💪 TRAINING DATABASE</h1>
            <p class="subtitle">LIFTING PROGRESS & STATS</p>
        </div>

        <div id="gym-entries" class="entries-grid">
            <div class="empty-state">
                <p>LOADING ENTRIES...</p>
            </div>
        </div>
    </main>

    <div class="scanline"></div>

    <!-- Firebase SDK -->
    <script type="module">
        // Import Firebase
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

       // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
        apiKey: "AIzaSyA72C91k6EpeUZvZ8r6oGgeD0diYs9dDDE",
        authDomain: "retrosite-7977d.firebaseapp.com",
        projectId: "retrosite-7977d",
        storageBucket: "retrosite-7977d.firebasestorage.app",
        messagingSenderId: "384802123307",
        appId: "1:384802123307:web:179cdf172e70ad0d4b046e",
        measurementId: "G-T6FS3XQFVW"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Load gym entries when page loads
        loadGymEntries();

        async function loadGymEntries() {
            const container = document.getElementById('gym-entries');
            
            try {
                // Get all gym entries from Firestore, ordered by date
                const q = query(collection(db, 'gymEntries'), orderBy('timestamp', 'desc'));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <p>NO ENTRIES FOUND</p>
                            <p class="small">GO TO ADMIN PANEL TO ADD YOUR FIRST WORKOUT</p>
                        </div>
                    `;
                    return;
                }

                // Build HTML for all entries
                let html = '';
                querySnapshot.forEach((doc) => {
                    const entry = doc.data();
                    html += `
                        <div class="entry-card">
                            <div class="entry-header">
                                <h3>${entry.title}</h3>
                                <span class="entry-date">${entry.date}</span>
                            </div>
                            
                            ${entry.videoUrl ? `
                                <div class="video-container">
                                    <iframe 
                                        src="${getYouTubeEmbedUrl(entry.videoUrl)}" 
                                        frameborder="0" 
                                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                        allowfullscreen>
                                    </iframe>
                                </div>
                            ` : ''}
                            
                            ${entry.imageUrl ? `
                                <div class="image-container">
                                    <img src="${entry.imageUrl}" alt="${entry.title}">
                                </div>
                            ` : ''}
                            
                            <div class="entry-notes">
                                <p>${entry.notes}</p>
                            </div>
                        </div>
                    `;
                });
                
                container.innerHTML = html;
                
            } catch (error) {
                console.error('Error loading entries:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <p>ERROR LOADING ENTRIES</p>
                        <p class="small">Check console for details</p>
                    </div>
                `;
            }
        }

        function getYouTubeEmbedUrl(url) {
            const videoId = url.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/);
            return videoId ? `https://www.youtube.com/embed/${videoId[1]}` : url;
        }
    </script>
    <script src="script.js"></script>
</body>
</html>
