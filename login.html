<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN LOGIN - ÜBERMENSCH.EXE</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="start-screen">
        <div class="game-title">
            <h1 class="glitch" data-text="ADMIN LOGIN">ADMIN LOGIN</h1>
            <p class="subtitle">AUTHORIZED ACCESS ONLY</p>
        </div>

        <div class="admin-form" style="max-width: 500px; margin: 0 auto;">
            <form id="login-form">
                <div class="form-group">
                    <label>EMAIL</label>
                    <input type="email" id="email" required placeholder="admin@example.com">
                </div>

                <div class="form-group">
                    <label>PASSWORD</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-primary">ACCESS SANCTUM</button>
                
                <div id="error-message" class="warning-text" style="display: none; margin-top: 20px;"></div>
            </form>

            <div style="text-align: center; margin-top: 30px;">
                <a href="index.html" class="nav-link">◄ BACK TO HOME</a>
            </div>
        </div>
    </div>

    <div class="scanline"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "AIzaSyA72C91k6EpeUZvZ8r6oGgeD0diYs9dDDE",
            authDomain: "retrosite-7977d.firebaseapp.com",
            projectId: "retrosite-7977d",
            storageBucket: "retrosite-7977d.firebasestorage.app",
            messagingSenderId: "384802123307",
            appId: "1:384802123307:web:179cdf172e70ad0d4b046e",
            measurementId: "G-T6FS3XQFVW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-message');
            
            try {
                await signInWithEmailAndPassword(auth, email, password);
                // Success - redirect to admin
                window.location.href = 'admin.html';
            } catch (error) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = '⚠ ACCESS DENIED: ' + error.message;
            }
        });
    </script>
    <script src="script.js"></script>
    <script>
        window.INK_ENABLED   = true;  // ← set false to disable ink on this page
        window.AUDIO_ENABLED = true;  // ← set false to disable fire audio on this page
    </script>
    <script src="ink.js"></script>
</body>
</html>
